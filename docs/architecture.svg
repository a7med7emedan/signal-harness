<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-labelledby="title desc">
  <title id="title">signal-harness pipeline</title>
  <desc id="desc">Candidates flow from source adapters through desk windows and the printed ledger into a validated issue model, which is rendered to a single HTML file and passed through ten publication gates. Each stage can refuse, with a distinct exit code.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14171C"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B3122E"/>
    </marker>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#14171C}
      .h{font-size:14px;font-weight:700}
      .s{font-size:11.5px;fill:#4A4F58}
      .k{font-size:10.5px;font-weight:700;letter-spacing:.12em;fill:#6E7480}
      .r{font-size:11px;fill:#B3122E;font-weight:600}
      .box{fill:#FFFFFF;stroke:#14171C;stroke-width:1.4}
      .band{fill:#101A33}
      .line{stroke:#14171C;stroke-width:1.4;fill:none}
      .fail{stroke:#B3122E;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
    </style>
  </defs>

  <rect x="0" y="0" width="1040" height="470" fill="#FAFAF7"/>

  <!-- title band -->
  <rect class="band" x="0" y="0" width="1040" height="46"/>
  <rect x="0" y="46" width="1040" height="4" fill="#E0492F"/>
  <text class="t" x="24" y="29" style="font-size:15px;font-weight:700;fill:#FFFFFF;letter-spacing:.18em">SIGNAL-HARNESS</text>
  <text class="t" x="1016" y="29" text-anchor="end" style="font-size:12px;fill:#C6CCDA">every stage can refuse, nothing downstream trusts anything upstream</text>

  <!-- stage labels -->
  <text class="t k" x="24" y="86">1  COLLECT</text>
  <text class="t k" x="194" y="86">2  SCOPE</text>
  <text class="t k" x="364" y="86">3  DEDUPLICATE</text>
  <text class="t k" x="534" y="86">4  VALIDATE</text>
  <text class="t k" x="704" y="86">5  RENDER</text>
  <text class="t k" x="874" y="86">6  GATE</text>

  <!-- boxes -->
  <rect class="box" x="24" y="100" width="146" height="150" rx="6"/>
  <text class="t h" x="38" y="126">Source adapters</text>
  <text class="t s" x="38" y="150">bioRxiv, medRxiv</text>
  <text class="t s" x="38" y="168">paginated details API</text>
  <text class="t s" x="38" y="192">posting date is the</text>
  <text class="t s" x="38" y="208">publication date</text>
  <text class="t s" x="38" y="232">revisions dropped</text>

  <rect class="box" x="194" y="100" width="146" height="150" rx="6"/>
  <text class="t h" x="208" y="126">Desk windows</text>
  <text class="t s" x="208" y="150">clinic, bio  3 days</text>
  <text class="t s" x="208" y="168">machine  7 days</text>
  <text class="t s" x="208" y="186">policy, record  10 days</text>
  <text class="t s" x="208" y="204">geek  10 days</text>
  <text class="t s" x="208" y="222">frontier  30 days</text>
  <text class="t s" x="208" y="240">boundaries inclusive</text>

  <rect class="box" x="364" y="100" width="146" height="150" rx="6"/>
  <text class="t h" x="378" y="126">Printed ledger</text>
  <text class="t s" x="378" y="150">JSON Lines</text>
  <text class="t s" x="378" y="168">append only, fsync</text>
  <text class="t s" x="378" y="192">a URL is never</text>
  <text class="t s" x="378" y="208">printed twice</text>
  <text class="t s" x="378" y="232">lines never rewritten</text>

  <rect class="box" x="534" y="100" width="146" height="150" rx="6"/>
  <text class="t h" x="548" y="126">Issue model</text>
  <text class="t s" x="548" y="150">one lead, ids ascend</text>
  <text class="t s" x="548" y="168">dates inside windows</text>
  <text class="t s" x="548" y="192">full story needs a</text>
  <text class="t s" x="548" y="208">five step mechanism</text>
  <text class="t s" x="548" y="232">unknown fields refused</text>

  <rect class="box" x="704" y="100" width="146" height="150" rx="6"/>
  <text class="t h" x="718" y="126">Renderer</text>
  <text class="t s" x="718" y="150">one HTML file</text>
  <text class="t s" x="718" y="168">CSS inlined, no script</text>
  <text class="t s" x="718" y="192">locale independent</text>
  <text class="t s" x="718" y="208">output is escaped</text>
  <text class="t s" x="718" y="232">same input, same bytes</text>

  <rect class="box" x="874" y="100" width="146" height="150" rx="6" style="stroke:#E0492F;stroke-width:2"/>
  <text class="t h" x="888" y="126">Publication gates</text>
  <text class="t s" x="888" y="150">story parts present</text>
  <text class="t s" x="888" y="168">25 word sentences</text>
  <text class="t s" x="888" y="186">no dashes, no script</text>
  <text class="t s" x="888" y="204">anchors resolve</text>
  <text class="t s" x="888" y="222">tags balance</text>
  <text class="t s" x="888" y="240">works offline</text>

  <!-- forward arrows -->
  <path class="line" d="M170 175 H192" marker-end="url(#arrow)"/>
  <path class="line" d="M340 175 H362" marker-end="url(#arrow)"/>
  <path class="line" d="M510 175 H532" marker-end="url(#arrow)"/>
  <path class="line" d="M680 175 H702" marker-end="url(#arrow)"/>
  <path class="line" d="M850 175 H872" marker-end="url(#arrow)"/>

  <!-- refusals -->
  <path class="fail" d="M97 250 V292" marker-end="url(#arrow-red)"/>
  <text class="t r" x="97" y="308" text-anchor="middle">source unreachable</text>
  <text class="t r" x="97" y="323" text-anchor="middle">exit 2</text>

  <path class="fail" d="M437 250 V292" marker-end="url(#arrow-red)"/>
  <text class="t r" x="437" y="308" text-anchor="middle">already printed</text>
  <text class="t r" x="437" y="323" text-anchor="middle">exit 1</text>

  <path class="fail" d="M607 250 V292" marker-end="url(#arrow-red)"/>
  <text class="t r" x="607" y="308" text-anchor="middle">issue rejected</text>
  <text class="t r" x="607" y="323" text-anchor="middle">exit 1</text>

  <path class="fail" d="M947 250 V292" marker-end="url(#arrow-red)"/>
  <text class="t r" x="947" y="308" text-anchor="middle">not publishable</text>
  <text class="t r" x="947" y="323" text-anchor="middle">exit 1</text>

  <!-- ledger write back -->
  <path class="line" d="M947 100 V70 H492 V98" marker-end="url(#arrow)" style="stroke:#6E7480;stroke-dasharray:2 3"/>
  <text class="t s" x="720" y="64" text-anchor="middle">append to ledger only after the gates pass</text>

  <!-- reproducibility strip -->
  <rect x="24" y="352" width="996" height="94" rx="6" fill="#FFFFFF" stroke="#E4E1D9"/>
  <text class="t k" x="44" y="378">REPRODUCIBILITY</text>
  <text class="t s" x="44" y="402">Pinned dependencies, fixed month names, UTC, no timestamps in the output. The bundled example renders to a published SHA-256,</text>
  <text class="t s" x="44" y="420">and the test suite fails if a single byte changes. The same check runs in the container build, so an image cannot exist</text>
  <text class="t s" x="44" y="438">unless the tests passed inside it. Network access is confined to the source adapters, which tests replace with recorded payloads.</text>
</svg>
