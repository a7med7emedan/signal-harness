name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish the image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      # The test stage runs lint, the tests and the demo, so a failing tree
      # produces no image.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Render the demo with the image and check its checksum
        run: |
          mkdir -p build && chmod 777 build
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run --rm -v "$PWD/build:/work" "$IMAGE" demo -o /work/demo.html
          want=$(cut -d' ' -f1 src/signal_harness/examples/issue.sample.sha256)
          got=$(sha256sum build/demo.html | cut -d' ' -f1)
          test "$got" = "$want" && echo "reproducible $got"
