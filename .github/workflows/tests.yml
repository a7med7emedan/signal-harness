name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  LC_ALL: C.UTF-8
  TZ: UTC

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check
      - run: ruff format --check
      - run: pytest -q --cov
      - run: signal-harness demo -o build/demo.html
      - name: reproducibility
        shell: python
        run: |
          import hashlib, pathlib
          got = hashlib.sha256(pathlib.Path("build/demo.html").read_bytes()).hexdigest()
          want = pathlib.Path("src/signal_harness/examples/issue.sample.sha256").read_text().split()[0]
          assert got == want, f"{got} != {want}"
          print("reproducible", got)

